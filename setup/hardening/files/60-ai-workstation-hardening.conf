# Managed by ai-workstation setup (setup/hardening/sysctl.sh).
# Source of truth: setup/hardening/files/60-ai-workstation-hardening.conf
# verification/check_sysctl.sh compares the running kernel against this file.
#
# Chosen for a development workstation: nothing here breaks Docker, Podman,
# VPNs, debuggers or IPv6 autoconfiguration. Deliberately NOT set:
#   net.ipv4.ip_forward            Docker, libvirt and VPNs need forwarding
#   net.ipv6.conf.*.accept_ra      IPv6 SLAAC on normal networks needs it
#   user namespace restrictions    rootless containers and browser sandboxes
#   rp_filter = 1 (strict)         breaks asymmetric VPN / multi-homed routing
#   kernel.yama.ptrace_scope >= 2  breaks attaching debuggers
#   kernel.kexec_load_disabled     cannot be undone without a reboot

# --- Kernel information exposure ---
# Hide kernel addresses from unprivileged users (makes exploits harder).
kernel.kptr_restrict = 1
# Only root can read the kernel log (it leaks addresses and hardware details).
kernel.dmesg_restrict = 1

# --- Process isolation ---
# A process may only ptrace its own descendants. `gdb ./prog` still works;
# attaching to an unrelated running process needs sudo.
kernel.yama.ptrace_scope = 1
# No core dumps from setuid programs (they could contain secrets).
fs.suid_dumpable = 0
# Full address space layout randomisation.
kernel.randomize_va_space = 2

# --- Filesystem link / FIFO protections (block /tmp race attacks) ---
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# --- BPF / kernel attack surface ---
# Harden the BPF JIT against spraying attacks (small performance cost).
net.core.bpf_jit_harden = 2
# Unprivileged users cannot load TTY line disciplines (historic exploit path).
dev.tty.ldisc_autoload = 0
# Unprivileged userfaultfd has been used to make kernel races reliable.
vm.unprivileged_userfaultfd = 0

# --- Network ---
net.ipv4.tcp_syncookies = 1
# Protect against TIME-WAIT assassination.
net.ipv4.tcp_rfc1337 = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
# Ignore ICMP redirects: a workstation should not let the LAN rewrite its routes.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
# Not a router: do not send redirects (container bridges do not need them).
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
# Source routing lets the sender choose the path; never needed.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
# Loose reverse-path filtering (Ubuntu's default, pinned): anti-spoofing
# that still works with VPNs and multiple interfaces.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
