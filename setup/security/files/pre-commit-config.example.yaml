# Example .pre-commit-config.yaml for projects using the pre-commit framework
# (https://pre-commit.com). Copy into a repository root, then:
#   pipx install pre-commit && pre-commit install
# Pin `rev` to a release you have reviewed; update it deliberately.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
