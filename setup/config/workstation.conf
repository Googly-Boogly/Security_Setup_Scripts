# shellcheck shell=bash disable=SC2034
# AI workstation bootstrap configuration.
#
# This file is sourced by Bash AS ROOT. The loader refuses to read it if it
# is world-writable or owned by someone other than root / the invoking user.
# Put machine-specific overrides in config/workstation.local.conf, which is
# loaded after this file and ignored by git.

# ============================================================================
# Base OS hardening
# ============================================================================
ENABLE_AUTO_UPDATES=true            # unattended security upgrades
UNATTENDED_AUTO_REBOOT=false        # never reboot a dev box behind your back
UNATTENDED_REBOOT_TIME="03:30"      # only used when auto reboot is true

ENABLE_FIREWALL=true                # UFW: deny incoming, allow outgoing, deny routed
UFW_LOGGING=low
# Extra inbound rules, passed verbatim to `ufw allow`. Empty means none.
# Example: FIREWALL_ALLOW_INBOUND=("from 192.168.1.0/24 to any port 8000 proto tcp")
FIREWALL_ALLOW_INBOUND=()

ENABLE_SYSCTL_HARDENING=true        # see hardening/files/60-ai-workstation-hardening.conf
ENABLE_APPARMOR=true
ENABLE_SERVICE_REVIEW=true          # report listening/questionable services
ENABLE_PERMISSION_FIXES=true        # conservative permission tightening

# Services disabled automatically *if present and enabled*. Keep this list to
# things that are clearly unnecessary on a workstation. Everything else is
# only reported for manual review.
#   cups-browsed: remote printer auto-discovery; remotely exploitable in 2024
#   (CVE-2024-47176) and not needed for normal local/network printing.
SERVICES_TO_DISABLE=(cups-browsed.service telnet.socket inetd.service xinetd.service
  rsh.socket rlogin.socket rexec.socket tftpd-hpa.service)

# --- SSH server (off by default) ---
ENABLE_SSH_SERVER=false
SSH_PORT=22
SSH_ALLOW_FROM=""                   # CIDR allowed to connect, e.g. "192.168.1.0/24". Empty = any (rate-limited)
SSH_ALLOW_USERS=""                  # space-separated AllowUsers list; empty = no restriction
SSH_ALLOW_TCP_FORWARDING=true       # VS Code Remote-SSH and port forwards need this
# When ENABLE_SSH_SERVER=false and openssh-server is installed, stop and
# disable it. Never done from inside an SSH session.
SSH_DISABLE_WHEN_NOT_ENABLED=true

# ============================================================================
# Development environment
# ============================================================================
ENABLE_PYTHON=true
ENABLE_NODE=true
NODE_MAJOR=24                       # current Node.js LTS line
ENABLE_PNPM=true
NODESOURCE_KEY_FINGERPRINT=""       # pin after verifying out-of-band (see README)
# npm lifecycle scripts are a common supply-chain vector, but many packages
# (esbuild, sharp, ...) need them. true = safer, occasionally breaks installs.
NPM_IGNORE_SCRIPTS=false

ENABLE_GIT=true
GIT_APPLY_SAFE_DEFAULTS=true        # only sets keys you have not set yourself

ENABLE_CONTAINERS=true
CONTAINER_RUNTIME=both              # docker | podman | both
DOCKER_KEY_FINGERPRINT="9DC858229FC7DD38854AE2D88D81803C0EBFCD88"
# Docker-published ports bypass UFW. Binding them to 127.0.0.1 by default
# means `docker run -p 8080:80` is local-only unless you explicitly write
# -p 0.0.0.0:8080:80.
DOCKER_PUBLISH_LOCALHOST_ONLY=true
DOCKER_LOG_MAX_SIZE=20m
DOCKER_LOG_MAX_FILE=5
DOCKER_LIVE_RESTORE=true
# Global no-new-privileges breaks images that rely on sudo/setuid inside the
# container. The agent runner always sets it per container regardless.
DOCKER_DEFAULT_NO_NEW_PRIVILEGES=false
# Membership in the docker group is equivalent to root on this machine.
# Leave false and prefer rootless Podman for agents unless you accept that.
DOCKER_ADD_USER_TO_GROUP=false

ENABLE_KUBERNETES=false
KUBERNETES_MINOR=v1.34              # pkgs.k8s.io repository line
KUBERNETES_KEY_FINGERPRINT=""
ENABLE_KIND=true                    # only when ENABLE_KUBERNETES=true
KIND_VERSION=v0.30.0
KIND_SHA256=""                      # optional pin; otherwise the published .sha256sum is used

ENABLE_TERRAFORM=false
HASHICORP_KEY_FINGERPRINT="798AEC654E5C15428C8E42EEAA16FCBCA621E701"

# ============================================================================
# Security tooling
# ============================================================================
ENABLE_AUDITD=true
AUDITD_LOG_ROOT_COMMANDS=true       # log every command run as root by a logged-in user

ENABLE_AIDE=true
AIDE_INIT_DB=false                  # initial database build takes 5-20 minutes; run `aide.sh init` when convenient

ENABLE_CONTAINER_SCANNING=true      # Trivy
TRIVY_KEY_FINGERPRINT=""
ENABLE_SECRETS_SCANNING=true        # Gitleaks

ENABLE_SURICATA=false               # passive IDS; CPU-hungry on busy links
SURICATA_INTERFACE=""               # empty = interface of the default route

ENABLE_MALWARE_SCANNING=false       # ClamAV (on demand) + rkhunter

ENABLE_LOG_MANAGEMENT=true          # logrotate, persistent journald, auditd log sizing
JOURNAL_MAX_USE=2G                  # journald disk cap
JOURNAL_MAX_RETENTION=6month        # journald age cap
# Forward syslog + audit events to a remote collector. Local logs can be
# erased by anyone who gets root; a remote copy cannot.
ENABLE_REMOTE_LOGGING=false
LOG_REMOTE_HOST=""
LOG_REMOTE_PORT=6514                # 6514 = syslog over TLS
LOG_REMOTE_TLS=true
LOG_REMOTE_CA_FILE=""               # CA certificate of the collector (required with TLS)
ENABLE_FAIL2BAN=false               # bans repeated SSH login failures; only used with ENABLE_SSH_SERVER=true

ENABLE_WAZUH_AGENT=false            # requires an existing Wazuh manager
WAZUH_MANAGER=""
WAZUH_AGENT_GROUP="default"
WAZUH_KEY_FINGERPRINT="0DCFCA5547B19D2A6099506096B3EE5F29111145"

# ============================================================================
# AI agent sandbox
# ============================================================================
ENABLE_AGENT_SANDBOX=true
AGENT_WORKSPACES_DIR=""             # empty = ~/agent-workspaces of the invoking user
AGENT_CONTAINER_RUNTIME=auto        # auto (rootless podman if installed, else docker) | podman | docker
AGENT_IMAGE="localhost/ai-agent-base:latest"
AGENT_DEFAULT_NETWORK=offline       # offline | restricted | internet
AGENT_DEFAULT_COMMAND=""            # empty = image default (bash)

# Per-agent limits (overridable per run with --memory/--cpus/--pids/--timeout)
AGENT_MAX_MEMORY=2g
AGENT_MAX_CPUS=2
AGENT_MAX_PIDS=256
AGENT_TIMEOUT=1800                  # seconds
AGENT_TMPFS_SIZE=512m

# Aggregate ceiling for all Docker agent containers together (systemd slice).
# Empty value = no aggregate limit for that resource.
AGENTS_SLICE_MEMORY_MAX="50%"
AGENTS_SLICE_CPU_QUOTA="400%"       # 100% = one full CPU
AGENTS_SLICE_TASKS_MAX=4096

# Egress proxy used by --network restricted. Pin by digest for reproducibility,
# e.g. docker.io/ubuntu/squid@sha256:<digest>.
AGENT_PROXY_IMAGE="docker.io/ubuntu/squid:latest"
AGENT_PROXY_ALLOWLIST=""            # empty = agents/policies/restricted-allowlist.txt

# Runner audit log rotation (per user, ~/.local/state/ai-agent-runner/)
AGENT_LOG_MAX_BYTES=10485760
AGENT_LOG_KEEP=5
# Also send each runner audit event to the system journal, which your user
# account cannot edit or delete (and which is forwarded when remote logging is on).
AGENT_LOG_TO_JOURNAL=true
